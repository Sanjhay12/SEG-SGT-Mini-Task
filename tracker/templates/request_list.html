{% extends "base.html" %}

{% block heading %}Requests{% endblock %}

{% block content %}

<select id= "sort-select" name="sort" aria-placeholder="Sort by">
  <option value="" selected disabled hidden>Sort by</option>
  <option value="title_ASC"> Title(A-Z)</option>
  <option value="title_DESC">Title(Z-A)</option>
  <option value="id_ASC"> Id#</option>
</select>


<table class="table table-hover">
  <thead>
    <tr>
      <th>#</th>
      <th>Title</th>
      <th>Description</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="request-rows">
    {% for request in requests %}
      <tr>
        <td>{{ request.pk }}</td>
        <td><a href="{% url 'view_request' request.pk %}">{{ request.title }}</a></td>
        <td>{{ request.description|truncatechars:80 }}</td>
        <td>
          <a href="{% url 'view_request' request.pk %}" title="Show"><i class="bi bi-eye"></i></a>
          <a href="{% url 'update_request' request.pk %}" title="Edit"><i class="bi bi-pencil"></i></a>
          <a class="text-danger" href="{% url 'delete_request' request.pk %}" title="Delete"><i class="bi bi-trash"></i></a>
        </td>
      </tr>
    {% empty %}
      <tr><td colspan="4">No requests yet.</td></tr>
    {% endfor %}
  </tbody>
</table>

<script>
  const select = document.getElementById("sort-select");
  select.addEventListener("change", async() =>{
    const url = "?sort=" + select.value;

    const response = await fetch(url);
    const html = await response.text();

    const doc = new DOMParser().parseFromString(html, "text/html");
    const newRows = doc.getElementById("request-rows");
    document.getElementById("request-rows").innerHTML = newRows.innerHTML;
  
  });
    


</script>

<a class="btn btn-primary" href="{% url 'create_request' %}">New request</a>
{% endblock %}
